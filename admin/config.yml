backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/joaobrandao.work
  branch: main
  base_url: https://YOUR-AUTH-WORKER.workers.dev

media_folder: media
public_folder: /media

collections:
  - name: pieces
    label: Standalone Pieces
    label_singular: Standalone Piece
    folder: content/pieces
    create: true
    slug: "{{year}}-{{slug}}"
    fields:
      - { name: title,   label: Image Title,      widget: string }
      - { name: year,    label: Year,             widget: number, value_type: int, min: 1900, max: 2100 }
      - { name: image,   label: Image,            widget: image }
      - { name: credits, label: Additional Credits, widget: text, required: false }

  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    create: true
    slug: "{{year}}-{{slug}}"
    fields:
      - { name: title,       label: Project Title,      widget: string }
      - { name: year,        label: Year,               widget: number, value_type: int, min: 1900, max: 2100 }
      - { name: description, label: Description,        widget: text, required: false }
      - { name: credits,     label: Additional Credits, widget: text, required: false }
      - name: media
        label: Media
        label_singular: Media Item
        widget: list
        summary: "{{fields.title}} ({{fields.type}})"
        fields:
          - { name: title, label: Title, widget: string, required: false }
          - name: type
            label: Type
            widget: select
            options: [image, video]
            default: image
          - { name: image, label: Image, widget: image, required: false, hint: "Fill this if Type is image" }
          - { name: video, label: Video, widget: file,  required: false, hint: "Fill this if Type is video (MP4, H.264)" }
